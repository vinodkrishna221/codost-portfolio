<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Chat Bubbles: Two overlapping rounded speech bubbles representing conversation & connection -->
  <!-- Large bubble (Codost - the partner) -->
  <rect x="2" y="4" width="18" height="14" rx="7" fill="#0891b2"/>
  <!-- Large bubble tail -->
  <path d="M 8 18 L 5 23 L 12 18" fill="#0891b2"/>
  <!-- Small bubble (the client) -->
  <rect x="14" y="12" width="16" height="12" rx="6" fill="#06b6d4"/>
  <!-- Small bubble tail -->
  <path d="M 24 24 L 27 28 L 22 24" fill="#06b6d4"/>
  <!-- Connection dots inside large bubble - representing understanding -->
  <circle cx="8" cy="11" r="1.5" fill="#ecfeff"/>
  <circle cx="12" cy="11" r="1.5" fill="#ecfeff"/>
  <circle cx="16" cy="11" r="1.5" fill="#ecfeff"/>
  <!-- Heart/checkmark in small bubble - representing care -->
  <path d="M 20 17.5 L 22 19.5 L 26 16" stroke="#ecfeff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
