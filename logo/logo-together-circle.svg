  <rect x="14" y="3" width="4" height="26" rx="2" fill="#0e7490"/>
  <!-- Warm center dot - the partnership spark -->
  <circle cx="16" cy="16" r="3" fill="#ecfeff"/>
  <!-- Tiny heart silhouette inside the center -->
  <path d="M 16 14.5 C 15 13.5 13.5 14 13.5 15 C 13.5 16.5 16 18 16 18 C 16 18 18.5 16.5 18.5 15 C 18.5 14 17 13.5 16 14.5 Z" fill="#0891b2"/>
</svg>
