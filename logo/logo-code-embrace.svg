  <circle cx="6" cy="16" r="1.2" fill="#0891b2"/>
  <circle cx="26" cy="16" r="1.2" fill="#0891b2"/>
  <!-- Center handshake abstraction - two small arcs meeting -->
  <path d="M 13 14 Q 16 12 19 14" stroke="#0e7490" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M 13 18 Q 16 20 19 18" stroke="#0e7490" stroke-width="1.5" stroke-linecap="round" fill="none"/>
