  <path d="M 13 3 Q 8 3 8 8 L 8 12 Q 8 14 6 16 Q 8 18 8 20 L 8 24 Q 8 29 13 29" 
        stroke="#0891b2" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Right bracket/figure -->
