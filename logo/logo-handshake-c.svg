<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- The Handshake C: Letter C formed by two simplified hands reaching toward each other -->
  <!-- Left hand (palm facing right) -->
  <path d="M 6 10 C 6 6 10 4 14 4 L 18 4" stroke="#0891b2" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Right hand (palm facing left) -->
  <path d="M 6 22 C 6 26 10 28 14 28 L 18 28" stroke="#0891b2" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- The handshake clasp in the middle-right -->
  <path d="M 18 4 C 24 4 26 8 26 12 C 26 14 24 15 22 15" stroke="#0891b2" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 18 28 C 24 28 26 24 26 20 C 26 18 24 17 22 17" stroke="#0891b2" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Clasp meeting point - warm dot -->
  <circle cx="22" cy="16" r="2" fill="#0891b2"/>
  <circle cx="22" cy="16" r="1" fill="#ecfeff"/>
</svg>
