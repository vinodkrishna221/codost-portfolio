<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Merge Arrow: Stylized "C" from two converging arrows merging into one -->
  <!-- Upper arrow flowing in -->
  <path d="M 26 6 L 18 6 Q 10 6 8 12 L 6 16" 
        stroke="#0891b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Lower arrow flowing in -->
  <path d="M 26 26 L 18 26 Q 10 26 8 20 L 6 16" 
        stroke="#0891b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Merge point glow -->
  <circle cx="6" cy="16" r="2.5" fill="#0891b2" opacity="0.2"/>
  <circle cx="6" cy="16" r="1.5" fill="#0891b2"/>
  <!-- Arrow heads on entry points -->
  <path d="M 24 3.5 L 26 6 L 23 7" stroke="#0e7490" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M 24 28.5 L 26 26 L 23 25" stroke="#0e7490" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Output arrow going right from merge point -->
  <path d="M 6 16 L 4 16" stroke="#065f76" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 5 13.5 L 3 16 L 5 18.5" stroke="#065f76" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
