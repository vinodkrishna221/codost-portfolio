<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Smile Arrow: Letter C with a smile-arrow underneath (Amazon meets Codost) -->
  <!-- The letter C - bold, friendly, geometric -->
  <path d="M 24 8 C 22 4 18 2 14 2 C 8 2 3 7 3 14 C 3 21 8 26 14 26 C 18 26 22 24 24 20" 
        stroke="#0891b2" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- The smile/arrow: curves from bottom of C to right, suggesting forward movement + happiness -->
  <path d="M 6 26 Q 14 32 26 24" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Arrow tip on the smile -->
  <path d="M 23 22 L 26 24 L 23 26" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
