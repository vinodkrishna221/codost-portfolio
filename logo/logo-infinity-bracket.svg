<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Infinity Bracket: ∞ symbol where each loop is formed from code brackets { and } -->
  <!-- Left loop (opening bracket { morphed into infinity left loop) -->
  <path d="M 16 16 C 16 10 12 6 8 6 C 4 6 2 10 2 14 C 2 18 4 20 6 16 C 4 12 4 10 6 8 C 8 6 12 8 14 12 L 16 16" 
        stroke="#0891b2" stroke-width="0" fill="none"/>
  <!-- Actual infinity bracket design - clean approach -->
  <!-- Left bracket-loop -->
  <path d="M 16 14 C 14 10 10 6 6 8 C 2 10 2 14 4 16 C 2 18 2 22 6 24 C 10 26 14 22 16 18"
        stroke="#0891b2" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Right bracket-loop -->
  <path d="M 16 14 C 18 10 22 6 26 8 C 30 10 30 14 28 16 C 30 18 30 22 26 24 C 22 26 18 22 16 18"
        stroke="#0891b2" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Center crossing point accent -->
  <circle cx="16" cy="16" r="1.5" fill="#0891b2"/>
  <!-- Bracket serifs - small horizontal ticks at the tips -->
  <path d="M 4 16 L 3 16" stroke="#0e7490" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 28 16 L 29 16" stroke="#0e7490" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
